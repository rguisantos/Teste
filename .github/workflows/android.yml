name: APK Android de teste

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-prototype
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.4.1
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.signing/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK
        run: sdkmanager 'platform-tools' 'build-tools;34.0.0' 'platforms;android-34'
      - name: Recuperar assinatura de teste
        uses: actions/cache@v4
        with:
          path: .signing
          key: android-test-signing-v1
      - name: Preparar assinatura
        env:
          EXISTING_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .signing
          if [ -n "$EXISTING_KEYSTORE" ]; then
            printf '%s' "$EXISTING_KEYSTORE" | base64 --decode > .signing/debug.keystore
          fi
          if [ ! -f .signing/debug.keystore ]; then
            keytool -genkeypair -keystore .signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=BR' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Instalar Godot e templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fLsS "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fLsS "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/android_debug.apk' 'templates/android_release.apk' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      - name: Importar e testar
        run: |
          python3 tools/verify_project.py
          python3 tools/configure_android.py
      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/cidades-brasil-prototipo-0.0.17.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify build/cidades-brasil-prototipo-0.0.17.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cidades-brasil-apk
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
